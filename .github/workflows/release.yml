name: Validate and release static site

on:
  push:
    tags: ['v*.*.*']

permissions: {}

jobs:
  validate:
    name: Reuse complete validation
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  release:
    name: Package and publish GitHub Release
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require the tagged commit to be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Build deterministic release assets
        run: python scripts/package_release.py "$GITHUB_REF_NAME"

      - name: Publish archive, checksum and manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*.zip dist/*.sha256 dist/*-manifest.json
          --verify-tag
          --title "Nigeria WebGIS ${GITHUB_REF_NAME}"
          --notes-file dist/*-notes.md
