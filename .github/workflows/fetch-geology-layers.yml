name: Fetch geology-associated vector and raster layers
# Re-fetch the seven Nigeria geology-associated layers (BGS Nigeria hydrogeology,
# WHYMAP ECOWAS hydrogeological units + cover, WPDx boreholes, IGRAC transboundary
# aquifers, Fan water table depth, EMAG2 magnetic anomaly) and commit the resulting
# GeoPackages into data/.  Run manually with:
#   gh workflow run fetch-geology-layers.yml
# Sources, licences and method: docs/geology-layers.md
on:
  workflow_dispatch:
  push:
    paths: ['scripts/fetch_geology_layers.py', '.github/workflows/fetch-geology-layers.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install geo dependencies
        run: pip install --quiet numpy Pillow tifffile rasterio imagecodecs netCDF4 geopandas pyogrio shapely pandas
      - name: Fetch and build the seven layers
        run: |
          set -o pipefail
          python scripts/fetch_geology_layers.py 2>&1 | tee /tmp/fetch-geology.log
      - name: Verify and commit
        run: |
          set -o pipefail
          {
          set -x
          python - <<'PY'
          import glob, os, sqlite3
          names = ('groundwater_aquifers_bgs2019_pg', 'groundwater_units_ecowas2022_pg',
                   'groundwater_cover_ecowas2022_pg', 'groundwater_boreholes_wpdx_pt',
                   'groundwater_transboundary_igrac2025_pg',
                   'groundwater_water_table_fan2017_rst', 'geophysics_magnetic_emag2_rst')
          for n in names:
              p = 'data/' + n + '.gpkg'
              if not (os.path.exists(p) and os.path.getsize(p) > 1024):
                  print('MISSING', p)
                  continue
              c = sqlite3.connect(p)
              rows = c.execute('select table_name,data_type,srs_id from gpkg_contents').fetchall()
              print(n, f'{os.path.getsize(p)/1e6:.2f} MB', rows)
              for (t, dt) in rows:
                  if dt == 'features':
                      print('   rows:', c.execute('select count(*) from "%s"' % t).fetchone()[0])
              c.close()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.gpkg
          git status --short
          git diff --cached --quiet || (git commit -m "Add fetched Nigeria geology layers [skip ci]" && git push)
          } 2>&1 | tee -a /tmp/fetch-geology.log
      - name: Save diagnostics
        if: always()
        run: |
          echo "=== git status ===" >> /tmp/fetch-geology.log
          git status --short >> /tmp/fetch-geology.log
          echo "=== new gpkg sizes ===" >> /tmp/fetch-geology.log
          ls -l data/groundwater* data/geophysics* >> /tmp/fetch-geology.log 2>&1
          cp /tmp/fetch-geology.log docs/geology-fetch-log.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/geology-fetch-log.txt
          git diff --cached --quiet || (git commit -m "Record geology fetch diagnostics [skip ci]" && git push)
