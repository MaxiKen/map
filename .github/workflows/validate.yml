name: Validate geospatial data and site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Compile, validate artifacts, and run regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install geospatial dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q scripts tests

      - name: Validate GeoPackages and generated artifacts
        run: python scripts/validate_artifacts.py

      - name: Run full regression suite
        run: python -m unittest discover -s tests -v
