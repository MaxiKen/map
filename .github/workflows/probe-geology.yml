name: Probe geology-associated source URLs
# Temporary survey relay phase 2: inspect the exact files that will be imported.
# Writes docs/geology-source-probe.txt and commits it.
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe-geology.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install inspection dependencies
        run: pip install --quiet geopandas pyogrio shapely netCDF4 rasterio numpy pandas
      - name: Probe phase 2
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee /tmp/probe.log
          import io, os, urllib.request, zipfile, glob, json
          import numpy as np, geopandas as gpd
          UA = {'User-Agent': 'nigeria-webgis-source-probe/1.0'}
          TMP = '/tmp/geoprobe2'
          os.makedirs(TMP, exist_ok=True)
          BBOX = (2.5, 4.0, 15.0, 14.0)

          def get(url, name):
              p = os.path.join(TMP, name)
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=900) as r, open(p, 'wb') as f:
                  shutil_copy(r, f)
              print(f'  {name}: {os.path.getsize(p)/1e6:.2f} MB', flush=True)
              return p
          def shutil_copy(src, dst):
              while True:
                  b = src.read(1 << 20)
                  if not b: break
                  dst.write(b)

          def head(url):
              try:
                  req = urllib.request.Request(url, headers=UA, method='HEAD')
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return r.status, r.headers.get('Content-Length'), r.headers.get('Content-Type')
              except Exception as e:
                  return 'ERR', str(e)[:140], ''

          # ---------- Eawag groundwater-quality probability rasters -------------
          EAWAG = {
            'arsenic_maps': 'https://opendata.eawag.ch/dataset/96c10d69-078b-4db9-88d7-6c169826d91a/resource/81801478-47ba-41fb-8bea-280632526053/download/maps.zip',
            'arsenic_data': 'https://opendata.eawag.ch/dataset/96c10d69-078b-4db9-88d7-6c169826d91a/resource/f4d3a55b-018a-402b-9cda-7c5784828461/download/data.zip',
            'arsenic_readme': 'https://opendata.eawag.ch/dataset/96c10d69-078b-4db9-88d7-6c169826d91a/resource/f2a9aa6a-1f2c-4e9b-865b-8996e02d8086/download/readme.txt',
            'fluoride_maps': 'https://opendata.eawag.ch/dataset/2012f6f6-afb5-4c30-b032-89f28d0acd93/resource/840629ab-1899-4754-a2aa-827fe479a5ef/download/maps.zip',
            'fluoride_readme': 'https://opendata.eawag.ch/dataset/2012f6f6-afb5-4c30-b032-89f28d0acd93/resource/25d6dc05-8d74-460a-ac0f-323ff3d070ce/download/readme.txt',
          }
          print('=== Eawag arsenic / fluoride ===', flush=True)
          for k, u in EAWAG.items():
              print(f'  {k:18s} HEAD {head(u)}', flush=True)
          for k in ('arsenic_readme', 'fluoride_readme'):
              try:
                  p = get(EAWAG[k], k + '.txt')
                  print(open(p, errors='replace').read()[:2500], flush=True)
              except Exception as e:
                  print(f'  {k} failed {e}', flush=True)
          for k in ('arsenic_maps', 'fluoride_maps'):
              try:
                  p = get(EAWAG[k], k + '.zip')
                  with zipfile.ZipFile(p) as z:
                      for i in z.infolist()[:40]:
                          print(f'     {i.file_size/1e6:9.2f} MB  {i.filename}', flush=True)
                      z.extractall(os.path.join(TMP, k))
                  for tif in glob.glob(os.path.join(TMP, k, '**', '*.tif'), recursive=True)[:10]:
                      import rasterio
                      with rasterio.open(tif) as ds:
                          a = ds.read(1)
                          print(f'  TIF {os.path.basename(tif)}: shape={a.shape} dtype={a.dtype} '
                                f'crs={ds.crs} transform={ds.transform} nodata={ds.nodata} '
                                f'min={np.nanmin(a)} max={np.nanmax(a)}', flush=True)
              except Exception as e:
                  print(f'  {k} failed {type(e).__name__}: {e}', flush=True)

          # ---------- WTD NetCDF detail ----------------------------------------
          print('\n=== WTD NetCDF Nigeria window ===', flush=True)
          WTD_URL = 'http://thredds-gfnl.usc.es/thredds/fileServer/GLOBALWTDFTP/annualmeans/AFRICA_WTD_annualmean.nc'
          try:
              p = get(WTD_URL, 'wtd.nc')
              import netCDF4
              ds = netCDF4.Dataset(p)
              lat = np.asarray(ds['lat'][:]); lon = np.asarray(ds['lon'][:])
              print(f'  lat {lat.min()} .. {lat.max()} step {lat[1]-lat[0]}', flush=True)
              print(f'  lon {lon.min()} .. {lon.max()} step {lon[1]-lon[0]}', flush=True)
              print(f'  WTD attrs {dict(ds["WTD"].__dict__)}', flush=True)
              iy = np.where((lat >= BBOX[1]-0.1) & (lat <= BBOX[3]+0.1))[0]
              ix = np.where((lon >= BBOX[0]-0.1) & (lon <= BBOX[2]+0.1))[0]
              print(f'  Nigeria window iy {iy[0]}..{iy[-1]} ({len(iy)}), ix {ix[0]}..{ix[-1]} ({len(ix)})', flush=True)
              raw = ds['WTD'][0, iy[0]:iy[-1]+1, ix[0]:ix[-1]+1]
              msk = ds['mask'][iy[0]:iy[-1]+1, ix[0]:ix[-1]+1]
              print(f'  raw type {type(raw)} dtype {raw.dtype}', flush=True)
              a = np.asarray(np.ma.filled(raw, np.nan), dtype=np.float64)
              print(f'  scaled min/max {np.nanmin(a)} {np.nanmax(a)} percentiles '
                    f'{np.nanpercentile(a, [1, 5, 25, 50, 75, 95, 99])}', flush=True)
              print(f'  mask unique {np.unique(msk)[:10]} mean {msk.mean():.3f}', flush=True)
              inside = np.asarray(msk) == 1
              if inside.any():
                  av = a[inside]
                  print(f'  in-domain percentiles {np.nanpercentile(av, [1, 5, 25, 50, 75, 95, 99])}', flush=True)
              ds.close()
          except Exception as e:
              import traceback; traceback.print_exc()

          # ---------- EMAG2 remote window --------------------------------------
          print('\n=== EMAG2 remote GeoTIFF ===', flush=True)
          EMAG = 'https://geomag.colorado.edu/images/EMAG2/EMAG2_V2.tif'
          try:
              import rasterio
              from rasterio.windows import from_bounds
              os.environ['GDAL_DISABLE_READDIR_ON_OPEN'] = 'EMPTY_DIR'
              with rasterio.open('/vsicurl/' + EMAG) as ds:
                  print(f'  opened: shape={ds.shape} dtype={ds.dtypes} crs={ds.crs} '
                        f'transform={ds.transform} nodata={ds.nodata} count={ds.count}', flush=True)
                  win = from_bounds(*BBOX, transform=ds.transform)
                  a = ds.read(1, window=win)
                  print(f'  Nigeria window {a.shape} min={a.min()} max={a.max()} mean={a.mean():.2f}', flush=True)
          except Exception as e:
              print(f'  remote EMAG2 failed {type(e).__name__}: {str(e)[:300]}', flush=True)

          # ---------- IGRAC WFS transboundary aquifers -------------------------
          print('\n=== IGRAC WFS tba_map_2025 ===', flush=True)
          for layer in ('geonode:tba_map_2025', 'tbamap2015:tbamap_2015'):
              u = ('https://ggis.un-igrac.org/geoserver/ows?service=WFS&version=1.0.0&request=GetFeature'
                   f'&typeName={layer}&outputFormat=application/json&bbox=2.0,3.5,15.5,14.5&maxFeatures=100')
              try:
                  req = urllib.request.Request(u, headers=UA)
                  with urllib.request.urlopen(req, timeout=120) as r:
                      txt = r.read().decode('utf-8', 'replace')
                  j = json.loads(txt)
                  print(f'  {layer}: {len(j.get("features", []))} features, '
                        f'crs={j.get("crs")}', flush=True)
                  for f in j.get('features', [])[:5]:
                      print(f'     props={ {k: str(v)[:60] for k,v in f["properties"].items()} }', flush=True)
              except Exception as e:
                  print(f'  {layer} failed {type(e).__name__}: {str(e)[:200]}', flush=True)
                  try:
                      print('     body:', txt[:400], flush=True)
                  except Exception:
                      pass

          # ---------- WPDx Nigeria subset --------------------------------------
          print('\n=== WPDx Nigeria subset ===', flush=True)
          try:
              import pandas as pd
              p = get('https://data.humdata.org/dataset/29677a2d-1fb2-48a3-a06a-9c66800c418b/resource/1fdb9a0c-d145-49e5-a502-6a3bc63626e8/download/wpdx_enhanced.csv', 'wpdx.csv')
              d = pd.read_csv(p, skiprows=[1], low_memory=False)
              d['lat_deg'] = pd.to_numeric(d['lat_deg'], errors='coerce')
              d['lon_deg'] = pd.to_numeric(d['lon_deg'], errors='coerce')
              m = (d.lon_deg >= 2.5) & (d.lon_deg <= 15) & (d.lat_deg >= 4) & (d.lat_deg <= 14)
              print(f'  rows={len(d)} in-bbox={m.sum()} countries={d.clean_country_name.unique()[:8]}', flush=True)
              for c in ('water_source_clean', 'water_tech_clean', 'status_clean', 'facility_type',
                        'water_source_category', 'clean_adm1'):
                  print(f'  {c}: {d.loc[m, c].value_counts().head(8).to_dict()}', flush=True)
          except Exception as e:
              import traceback; traceback.print_exc()

          # ---------- BGS licence file ------------------------------------------
          print('\n=== BGS licence ===', flush=True)
          try:
              p = get('https://africagroundwateratlas.org/downloads/Nigeria.zip', 'bgs.zip')
              with zipfile.ZipFile(p) as z:
                  for n in z.namelist():
                      if 'Licence' in n or 'License' in n:
                          print(z.read(n).decode('utf-8', 'replace')[:2500], flush=True)
          except Exception as e:
              print(f'  BGS licence failed {e}', flush=True)

          print('\n=== DONE ===', flush=True)
          PY
      - name: Save probe report
        run: |
          cp /tmp/probe.log docs/geology-source-probe.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/geology-source-probe.txt
          git diff --cached --quiet || (git commit -m "Record geology source probe [skip ci]" && git push)
