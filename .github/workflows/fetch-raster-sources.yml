name: Fetch raster sources (relay)
on:
  push:
    branches: [arena/69f2a938-map]
    paths: ['.github/workflows/fetch-raster-sources.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/69f2a938-map
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install raster dependencies
        run: pip install --quiet numpy Pillow tifffile rasterio imagecodecs
      - name: Fetch and build the five rasters
        run: python scripts/fetch_rasters.py 2>&1 | tee /tmp/fetch.log
      - name: Verify GeoPackages
        run: |
          python - <<'PY'
          import glob, sqlite3
          for p in sorted(glob.glob('data/*_rst.gpkg')):
              c = sqlite3.connect(p)
              n = c.execute('select count(*) from gpkg_contents').fetchone()[0]
              t = c.execute('select table_name,data_type from gpkg_contents').fetchone()
              print(p, n, t)
              c.close()
          PY
      - name: Commit rasters and provenance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*_rst.gpkg
          cp /tmp/fetch.log docs/raster-fetch-log.txt
          git add docs/raster-fetch-log.txt
          git diff --cached --quiet || (git commit -m "Add fetched WorldClim / DEM / SoilGrids rasters [skip ci]" && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fetch-log
          path: /tmp/fetch.log
          if-no-files-found: warn
