name: Build and verify site

on:
  push:
    branches: [main]
    paths: ['data/**', 'app/**', 'scripts/**', 'config/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.11', cache: pip, cache-dependency-path: scripts/requirements.txt }
      - run: python -m pip install --disable-pip-version-check -r scripts/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: '22.22.3'
          cache: npm
      - name: Build and run every validation gate
        run: python scripts/maintain.py --build --check-build
      - name: Commit only a verified changed build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A public
          git diff --cached --quiet || (git commit -m "Rebuild verified site [skip ci]" && git push)
