name: Fetch final non-groundwater layers
# Final batch: World Bank / GFDRR landslide hazard (quantitative raster +
# classified vector) and IHFC 2024 geothermal heat-flow points.  Commits the
# three GeoPackages into their group folders under data/. Sources and licences: docs/final-layers.md
on:
  workflow_dispatch:
  push:
    paths: ['scripts/fetch_final_layers.py']
permissions:
  contents: write
jobs:
  fetch:
    # Mutable source refreshes belong only to deliberate main changes or manual dispatch.
    # Pull-request branch pushes and release tags must never fetch and commit data.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install geo dependencies
        run: pip install --quiet numpy Pillow tifffile rasterio imagecodecs geopandas pyogrio shapely pandas openpyxl
      - name: Fetch and build the final three layers
        run: |
          set -o pipefail
          python scripts/fetch_final_layers.py 2>&1 | tee /tmp/fetch-final.log
      - name: Verify and commit
        run: |
          python - <<'PY'
          import os, sqlite3, sys
          sys.path.insert(0, 'scripts')
          from data_paths import layer_path
          names = ('hazards_landslide_rainfall_wb_rst',
                   'hazards_landslide_classes_wb_pg',
                   'geology_heatflow_ihfc2024_pt')
          for n in names:
              p = layer_path('data', n)
              assert os.path.exists(p) and os.path.getsize(p) > 1024, p
              c = sqlite3.connect(p)
              rows = c.execute('select table_name,data_type,srs_id from gpkg_contents').fetchall()
              print(n, f'{os.path.getsize(p)/1e6:.2f} MB', rows)
              for (t, dt, _srs) in rows:
                  if dt == 'features':
                      print('   rows:', c.execute('select count(*) from "%s"' % t).fetchone()[0])
              c.close()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Add final non-groundwater Nigeria layers [skip ci]" && git push)
