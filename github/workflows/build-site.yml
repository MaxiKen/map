name: Build site
on:
  push:
    branches: [main]
    paths: ['data/**', 'app/**', 'scripts/**', 'config/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip, cache-dependency-path: scripts/requirements.txt }
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/build_site.py
      - name: Commit built site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A public
          git diff --cached --quiet || (git commit -m "Rebuild site from data [skip ci]" && git push)
